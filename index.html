<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LotlQuest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1420; }
  #app, #app > canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .ui { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2430; }

  /* Title screen */
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, rgba(10,20,32,.35), rgba(10,20,32,.62));
  }
  #title h1 {
    margin: 0; font-size: clamp(44px, 9vw, 92px); font-weight: 300;
    letter-spacing: .18em; color: #f4f8fb; text-transform: uppercase;
  }
  #title .tag { color: #cfe0ec; font-size: clamp(14px, 2.2vw, 19px); font-weight: 400; letter-spacing: .04em; }
  #playBtn {
    margin-top: 10px; padding: 14px 54px; font-size: 20px; letter-spacing: .06em;
    border: 0; border-radius: 999px; cursor: pointer;
    background: #f4c95d; color: #27303c; font-weight: 600;
  }
  #playBtn:hover { background: #ffd97a; }
  #title .hint { color: #9fb4c6; font-size: 13px; letter-spacing: .03em; }

  /* Frosted strips (pause / help / banner) */
  .sheet {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    min-width: 300px; max-width: 82vw; max-height: 80vh; overflow: auto;
    background: rgba(248, 250, 252, .92); border-radius: 14px; padding: 22px 28px;
    box-shadow: 0 12px 40px rgba(8,14,22,.35); display: none;
  }
  .sheet h2 { margin: 0 0 10px; font-weight: 600; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #37424f; }
  .sheet table { border-collapse: collapse; font-size: 14px; }
  .sheet td { padding: 3px 14px 3px 0; color: #2a3441; }
  .sheet td:first-child { font-weight: 600; color: #14202c; white-space: nowrap; }
  .sheet .foot { margin-top: 12px; font-size: 12px; color: #7a8a99; }
  .sheet button {
    margin-top: 14px; padding: 8px 26px; border: 0; border-radius: 999px; cursor: pointer;
    background: #27303c; color: #f4f8fb; font-size: 14px;
  }

  #banner {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    padding: 10px 34px; border-radius: 999px; background: rgba(248,250,252,.92);
    font-size: 26px; font-weight: 600; letter-spacing: .1em; color: #27303c; display: none;
  }

  /* Diagnostics overlay (dev) — below the minimap */
  #diag {
    position: absolute; left: 10px; top: 202px; padding: 8px 10px; display: none;
    font: 11px/1.5 ui-monospace, Menlo, monospace; color: #d7e4ee; white-space: pre;
    background: rgba(10,18,28,.72); border-radius: 8px; pointer-events: none;
  }

  #ctxlost {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #0b1420; color: #e8eef4; font-size: 18px; cursor: pointer;
  }

  /* NPC dialog card */
  #dialog {
    position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
    min-width: 320px; max-width: 60vw; display: none; cursor: pointer;
    background: rgba(248,250,252,.94); border-radius: 14px; padding: 14px 22px 12px;
    box-shadow: 0 10px 32px rgba(8,14,22,.35);
  }
  #dialog #dialogName {
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: #6b7a58; margin-bottom: 4px;
  }
  #dialog #dialogText { font-size: 16px; color: #27303c; line-height: 1.45; }
  #dialog .hint { margin-top: 8px; font-size: 11px; color: #9aa7b4; }

  /* location toast */
  #toast {
    position: absolute; left: 50%; top: 11%; transform: translateX(-50%) translateY(-8px);
    padding: 9px 30px; border-radius: 999px; background: rgba(248,250,252,.92);
    font-size: 17px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
    color: #27303c; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* corner minimap — upper left */
  #minimap {
    position: absolute; left: 14px; top: 14px; width: 176px; height: 176px;
    display: none; pointer-events: none; filter: drop-shadow(0 4px 14px rgba(8,14,22,.35));
  }

  /* help button — top right corner */
  #helpBtn {
    position: absolute; top: 12px; right: 14px; width: 36px; height: 36px;
    display: none; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(248,250,252,.85); color: #37424f; font-weight: 700; font-size: 19px;
    box-shadow: 0 2px 8px rgba(8,14,22,.3);
  }
  #helpBtn:hover { background: #ffffff; }

  /* HUD: hearts + tokens + weapon — upper right, under the help button */
  #hud {
    position: absolute; top: 58px; right: 14px; display: none; flex-direction: column;
    gap: 4px; pointer-events: none; align-items: flex-end; text-align: right;
  }
  #hearts { font-size: 24px; letter-spacing: 2px; text-shadow: 0 1px 3px rgba(8,14,22,.5); }
  #hearts .full { color: #e5484d; }
  #hearts .empty { color: rgba(240,244,248,.4); }
  #tokenRow { font-size: 17px; color: #f4f8fb; font-weight: 600; display: flex; align-items: center; gap: 7px; text-shadow: 0 1px 3px rgba(8,14,22,.5); }
  .coin { width: 14px; height: 14px; border-radius: 50%; background: #f4c95d; display: inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  #weaponRow { font-size: 12px; color: #dfe9f2; letter-spacing: .06em; text-shadow: 0 1px 2px rgba(8,14,22,.5); }

  #hurtflash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,50,40,.5)); opacity: 0; transition: opacity .18s; }
  #hurtflash.show { opacity: 1; }

  /* touch controls (coarse-pointer devices, or ?touch=1) */
  #joy {
    position: absolute; left: 26px; bottom: max(30px, env(safe-area-inset-bottom)); width: 128px; height: 128px;
    display: none; border-radius: 50%; background: rgba(16,26,40,.30);
    border: 2px solid rgba(248,250,252,.35); touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px;
    border-radius: 50%; background: rgba(248,250,252,.88);
    box-shadow: 0 3px 10px rgba(8,14,22,.4); pointer-events: none;
  }
  #attackBtn {
    position: absolute; right: 28px; bottom: max(44px, env(safe-area-inset-bottom)); width: 90px; height: 90px;
    display: none; border-radius: 50%; border: 0; touch-action: none; cursor: pointer;
    background: rgba(244,201,93,.92); color: #27303c; font-size: 34px;
    box-shadow: 0 4px 14px rgba(8,14,22,.35);
  }
  #attackBtn:active { background: #ffd97a; transform: scale(.94); }

  /* narrow screens: smaller map, and drop the place-name toast below the
     top UI so it isn't buried under the map/HUD */
  @media (max-width: 700px) {
    #minimap { width: 132px; height: 132px; }
    #toast { top: 176px; font-size: 14px; padding: 7px 20px; white-space: nowrap; }
    #diag { top: 158px; }
  }

  /* shop rows */
  .shopItem { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 8px 0; border-bottom: 1px solid rgba(30,40,52,.1); }
  .shopItem .info { display: flex; flex-direction: column; }
  .shopItem .info span { font-size: 12px; color: #66727f; max-width: 320px; }
  .shopItem .buy { margin: 0; padding: 7px 16px; border: 0; border-radius: 999px; cursor: pointer; background: #f4c95d; color: #27303c; font-weight: 600; white-space: nowrap; }
  .shopItem .buy:disabled { background: #d8dde2; color: #8a949e; cursor: default; }
  #shopTok { margin-bottom: 8px; color: #37424f; display: flex; align-items: center; gap: 6px; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>

<div id="title" class="ui">
  <h1>LotlQuest</h1>
  <div class="tag">An axolotl adventure</div>
  <button id="playBtn">Play now</button>
  <div class="hint">W/S walk &nbsp;·&nbsp; A/D turn &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; space jump &nbsp;·&nbsp; ? help</div>
</div>

<div id="pause" class="sheet ui"><h2>Paused</h2><div id="pauseBody"></div><button id="resumeBtn">Resume</button></div>
<div id="help" class="sheet ui"><h2>How to play</h2><div id="helpBody"></div><button id="helpClose">Close</button></div>
<div id="banner" class="ui"></div>
<div id="dialog" class="ui"><div id="dialogName"></div><div id="dialogText"></div><div class="hint">click for more · Esc to close</div></div>
<div id="toast" class="ui"></div>
<button id="helpBtn" class="ui">?</button>
<div id="hud" class="ui">
  <div id="hearts"></div>
  <div id="tokenRow"><span class="coin"></span><span id="tokenCount">0</span></div>
  <div id="weaponRow"></div>
</div>
<div id="shop" class="sheet ui"><h2 id="shopTitle">The Armory</h2><div id="shopTok"></div><div id="shopItems"></div><button id="shopClose">Leave</button></div>
<div id="hurtflash"></div>
<div id="joy" class="ui"><div id="joyKnob"></div></div>
<button id="attackBtn" class="ui">⚔</button>
<canvas id="minimap"></canvas>
<div id="diag"></div>
<div id="ctxlost" class="ui">Graphics reset — tap to reload</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
